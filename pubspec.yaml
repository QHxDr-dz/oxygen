name: oxygenclub
description: A new Flutter project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Core UI and responsive design
  sizer: ^2.0.15
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  web: ^1.1.1

  # Feature dependencies
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0
  json_annotation: ^4.12.0
  pretty_qr_code: ^3.6.0
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/
    - assets/images/
